[project]
name = "outreachyr"
version = "0.1.0"
description = "Email outreach helper with a FastAPI backend."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.115,<1",
    "google-api-python-client>=2,<3",
    "google-auth>=2,<3",
    "google-auth-oauthlib>=1,<2",
    "psycopg[binary]>=3.2,<4",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.32,<1",
]

[tool.uv]
package = false
